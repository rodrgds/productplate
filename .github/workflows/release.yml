name: Release Product Plate

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  NODE_OPTIONS: --max_old_space_size=6144
  PUBLIC_CONVEX_URL: https://agreeable-otter-123.convex.cloud
  PUBLIC_CONVEX_SITE_URL: https://agreeable-otter-123.convex.site
  SITE_URL: https://release.example.com
  BETTER_AUTH_URL: https://release.example.com
  BETTER_AUTH_SECRET: release-build-secret-that-is-never-deployed

jobs:
  profiles:
    uses: ./.github/workflows/profile-matrix.yml

  release:
    needs: profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile
      - run: bun run verify:full
      - run: bun run verify
        working-directory: packages/create-product-plate

      - name: Validate tag and prepare release assets
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: bun run release:assets -- "${RELEASE_VERSION#v}"

      - name: Attest release archive
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/release/product-plate-*.tar.gz

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/release/* --generate-notes --verify-tag
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

      - name: Verify GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verification_dir="$(mktemp -d)"
          trap 'rm -rf "$verification_dir"' EXIT
          gh release download "$GITHUB_REF_NAME" --dir "$verification_dir"
          test -s "$verification_dir/product-plate-template.json"
          test -s "$verification_dir/product-plate-upgrade.json"
          test -s "$verification_dir/product-plate-upgrade-v2.json"
          test -s "$verification_dir/SHA256SUMS"
          (
            cd "$verification_dir"
            sha256sum --check SHA256SUMS
          )

      - name: Exchange npm trusted-publishing token
        id: npm-auth
        run: |
          id_token="$(
            curl --fail --silent --show-error \
              --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
              | jq --raw-output '.value // empty'
          )"
          test -n "$id_token"

          npm_token="$(
            curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${id_token}" \
              https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/create-product-plate \
              | jq --raw-output '.token // empty'
          )"
          test -n "$npm_token"
          echo "::add-mask::${npm_token}"
          printf 'token=%s\n' "$npm_token" >> "$GITHUB_OUTPUT"

      - name: Publish create-product-plate
        working-directory: packages/create-product-plate
        env:
          NPM_CONFIG_TOKEN: ${{ steps.npm-auth.outputs.token }}
        run: bun publish --access public
